<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Atendimento PRO</title>
  <style>
    :root {
      --bg-1: #1e3c72;
      --bg-2: #2a5298;
      --card: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.2);
      --text: #ffffff;
      --muted: #d7e3ff;
      --focus: #90caf9;
      --ok: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 200px;
      max-width: 45vw;
      height: auto;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px;
    }

    .brand h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, minmax(280px, 1fr));
      gap: 16px;
    }

    .glass {
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    h2 {
      margin: 0 0 6px;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .checklist label {
      display: block;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin-bottom: 6px;
    }

    input, textarea, button {
      border-radius: 8px;
      border: 1px solid transparent;
      font: inherit;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--focus);
      box-shadow: 0 0 0 2px rgba(144, 202, 249, 0.3);
    }

    button {
      min-width: 80px;
      padding: 8px 10px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.18);
      color: var(--text);
      border: 1px solid var(--card-border);
      transition: 0.2s ease;
    }

    button:hover { background: rgba(255, 255, 255, 0.28); }

    button:active { transform: translateY(1px); }

    .btn-danger {
      background: rgba(239, 68, 68, 0.24);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.25);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status.ok { color: #bbf7d0; border: 1px solid rgba(34, 197, 94, 0.5); }
    .status.error { color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.5); }

    .footnote {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.9;
    }

    @media (max-width: 980px) {
      .container { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <header class="topbar">
      <div class="brand">
        <img src="brasilseg_tagline_branco.png" alt="BrasilSeg" onerror="this.style.display='none'">
        <h1>Painel Atendimento PRO</h1>
      </div>
      <div class="topbar-actions">
        <button type="button" onclick="copiarTudo()">Copiar resumo</button>
        <button type="button" class="btn-danger" onclick="limparCampos()">Limpar tudo</button>
      </div>
    </header>

    <section class="container">
      <div class="col">
        <div class="glass checklist">
          <h2>Confirmação IDPOS</h2>
          <label><input id="chk_nome" type="checkbox"> Nome</label>
          <label><input id="chk_cpf" type="checkbox"> CPF</label>
          <label><input id="chk_nasc" type="checkbox"> Data Nascimento</label>
        </div>

        <div class="glass checklist">
          <h2>Atualização Cadastral</h2>
          <label><input id="chk_tel" type="checkbox"> Telefone</label>
          <label><input id="chk_email" type="checkbox"> Email</label>
        </div>

        <div class="glass checklist">
          <h2>Não esquece</h2>
          <label><input id="chk_kit" type="checkbox"> KIT SINISTRO</label>
          <label><input id="chk_manual" type="checkbox"> MANUAL RESÍDUOS</label>
          <label><input id="chk_nps" type="checkbox"> NPS</label>
          <label><input id="chk_prazo" type="checkbox"> PRAZO</label>
          <label><input id="chk_itens" type="checkbox"> ITENS PESSOAIS</label>
        </div>
      </div>

      <div class="col">
        <div class="glass">
          <h2>Segurado</h2>
          <div class="field-row"><input id="nome" data-label="Nome" placeholder="Nome completo"><button onclick="copy('nome')">Copiar</button></div>
          <div class="field-row"><input id="cpf" data-label="CPF" placeholder="000.000.000-00"><button onclick="copy('cpf')">Copiar</button></div>
          <div class="field-row"><input id="nasc" data-label="Data de nascimento" placeholder="dd/mm/aaaa"><button onclick="copy('nasc')">Copiar</button></div>
          <div class="field-row"><input id="tel" data-label="Telefone" placeholder="(00) 00000-0000"><button onclick="copy('tel')">Copiar</button></div>
          <div class="field-row"><input id="email" data-label="Email" type="email" placeholder="email@dominio.com"><button onclick="copy('email')">Copiar</button></div>
        </div>

        <div class="glass">
          <h2>Funcionário BB</h2>
          <div class="field-row"><input id="funcnome" data-label="Nome funcionário" placeholder="Nome do funcionário"><button onclick="copy('funcnome')">Copiar</button></div>
          <div class="field-row"><input id="matricula" data-label="Matrícula" placeholder="Matrícula"><button onclick="copy('matricula')">Copiar</button></div>
          <div class="field-row"><input id="prefixo" data-label="Prefixo" placeholder="Prefixo"><button onclick="copy('prefixo')">Copiar</button></div>
          <div class="field-row"><input id="email2" data-label="Email funcionário" type="email" placeholder="email@bb.com"><button onclick="copy('email2')">Copiar</button></div>
          <div class="field-row"><input id="tel2" data-label="Telefone funcionário" placeholder="(00) 00000-0000"><button onclick="copy('tel2')">Copiar</button></div>
        </div>

        <div class="glass">
          <h2>Terceiro</h2>
          <div class="field-row"><input id="terc" data-label="Nome terceiro" placeholder="Nome"><button onclick="copy('terc')">Copiar</button></div>
          <div class="field-row"><input id="terccpf" data-label="CPF terceiro" placeholder="000.000.000-00"><button onclick="copy('terccpf')">Copiar</button></div>
          <div class="field-row"><input id="terctel" data-label="Telefone terceiro" placeholder="(00) 00000-0000"><button onclick="copy('terctel')">Copiar</button></div>
          <div class="field-row"><input id="tercemail" data-label="Email terceiro" type="email" placeholder="email@dominio.com"><button onclick="copy('tercemail')">Copiar</button></div>
        </div>

        <div class="glass">
          <h2>Endereço risco</h2>
          <div class="field-row"><input id="end" data-label="Endereço" placeholder="Rua, número, complemento"><button onclick="copy('end')">Copiar</button></div>
          <div class="field-row"><input id="cep" data-label="CEP" placeholder="00000-000"><button onclick="copy('cep')">Copiar</button></div>
        </div>
      </div>

      <div class="col">
        <div class="glass">
          <h2>Evento</h2>
          <div class="field-row"><input id="evento" data-label="Evento" placeholder="Descrição do evento"><button onclick="copy('evento')">Copiar</button></div>
          <div class="field-row"><input id="data" data-label="Data do evento" placeholder="dd/mm/aaaa"><button onclick="copy('data')">Copiar</button></div>
        </div>

        <div class="glass">
          <h2>Ocorrência</h2>
          <div class="field-row"><textarea id="oc1" data-label="Ocorrência 1" placeholder="Detalhe da ocorrência"></textarea><button onclick="copy('oc1')">Copiar</button></div>
          <div class="field-row"><textarea id="oc2" data-label="Ocorrência 2" placeholder="Detalhe complementar"></textarea><button onclick="copy('oc2')">Copiar</button></div>
          <div class="field-row"><textarea id="oc3" data-label="Ocorrência 3" placeholder="Conclusão"></textarea><button onclick="copy('oc3')">Copiar</button></div>
        </div>

        <div class="glass">
          <h2>Sinistro</h2>
          <div class="field-row"><input id="sin1" data-label="Sinistro 1" placeholder="Campo 1"><button onclick="copy('sin1')">Copiar</button></div>
          <div class="field-row"><input id="sin2" data-label="Sinistro 2" placeholder="Campo 2"><button onclick="copy('sin2')">Copiar</button></div>
          <div class="field-row"><input id="sin3" data-label="Sinistro 3" placeholder="Campo 3"><button onclick="copy('sin3')">Copiar</button></div>
          <div class="field-row"><input type="datetime-local" id="datahora" data-label="Data e hora"></div>
        </div>

        <div id="status" class="status" role="status" aria-live="polite">Pronto para copiar e preencher.</div>
        <p class="footnote">Os dados são salvos automaticamente no navegador (localStorage).</p>
      </div>
    </section>
  </main>

  <script>
    const selectors = 'input[id], textarea[id]';

    function showStatus(message, type = '') {
      const box = document.getElementById('status');
      box.textContent = message;
      box.className = `status ${type}`.trim();
    }

    async function copy(id) {
      const el = document.getElementById(id);
      if (!el) return;

      const value = (el.value || '').trim();
      const label = el.dataset.label || id;

      if (!value) {
        showStatus(`Nada para copiar em: ${label}.`, 'error');
        return;
      }

      try {
        await navigator.clipboard.writeText(value);
        showStatus(`Copiado: ${label}.`, 'ok');
      } catch {
        showStatus('Não foi possível copiar automaticamente. Verifique permissões do navegador.', 'error');
      }
    }

    async function copiarTudo() {
      const fields = [...document.querySelectorAll(selectors)];
      const lines = fields
        .map((el) => {
          const value = (el.value || '').trim();
          if (!value) return null;
          const label = el.dataset.label || el.id;
          return `${label}: ${value}`;
        })
        .filter(Boolean);

      if (!lines.length) {
        showStatus('Preencha ao menos um campo para copiar o resumo.', 'error');
        return;
      }

      const resumo = lines.join('\n');
      try {
        await navigator.clipboard.writeText(resumo);
        showStatus('Resumo completo copiado com sucesso.', 'ok');
      } catch {
        showStatus('Não foi possível copiar o resumo completo.', 'error');
      }
    }

    function persistirCampo(el) {
      localStorage.setItem(`painel:${el.id}`, el.type === 'checkbox' ? String(el.checked) : el.value);
    }

    function restaurarCampos() {
      document.querySelectorAll('input[id], textarea[id], input[type="checkbox"]').forEach((el) => {
        const key = `painel:${el.id}`;
        const saved = localStorage.getItem(key);
        if (saved === null) return;
        if (el.type === 'checkbox') {
          el.checked = saved === 'true';
        } else {
          el.value = saved;
        }
      });
    }

    function limparCampos() {
      document.querySelectorAll('input[id], textarea[id], input[type="checkbox"]').forEach((el) => {
        if (el.type === 'checkbox') {
          el.checked = false;
        } else {
          el.value = '';
        }
      });

      Object.keys(localStorage)
        .filter((key) => key.startsWith('painel:'))
        .forEach((key) => localStorage.removeItem(key));

      showStatus('Campos e dados locais removidos.', 'ok');
    }

    document.querySelectorAll('input[id], textarea[id], input[type="checkbox"]').forEach((el) => {
      el.addEventListener('input', () => persistirCampo(el));
      if (el.type === 'checkbox') {
        el.addEventListener('change', () => persistirCampo(el));
      }
    });

    restaurarCampos();
  </script>
</body>
</html>
